<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Viitorul la puterea noi - Am întrebat 100 de Clienți</title>
    <script>
        (function() {
            const versiuneCod = "v3.2"; 
            const savedVersion = localStorage.getItem("clienti100_version");
            if (savedVersion !== versiuneCod) {
                localStorage.setItem("clienti100_version", versiuneCod);
                if (!window.location.search.includes("nocache")) {
                    window.location.replace(window.location.pathname + "?nocache=" + Date.now());
                }
            }
        })();
    </script>
    <style>
        :root {
            --bg-dark: #02091A;
            --panel-bg: #030D22;
            --border-neon: #00D2FF;
            --text-gold: #FFC800;
            --neon-red: #FF0044;
            --neon-blue: #00F0FF;
            --button-dark: #0A1325;
            --revealed-bg: #162340;
            --revealed-fg: #00FFCC;
            --active-green: #00FF66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px 20px 15px 20px;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        .fullscreen-btn {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--button-dark);
            color: var(--neon-blue);
            border: 1px solid var(--border-neon);
            padding: 4px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            z-index: 100;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .fullscreen-btn:hover {
            opacity: 1;
        }

        .container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            padding-top: 35px;
        }

        .team-panel {
            display: flex;
            flex-direction: column;
        }

        .team-title {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            line-height: 1;
        }

        #lbl-e1 { color: var(--text-gold); }
        #lbl-e2 { color: var(--neon-red); text-align: right; }

        .btn-team {
            background-color: #050B17;
            color: #FFFFFF;
            border: 2px solid;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
            width: fit-content;
        }

        #btn-e1 { border-color: var(--text-gold); }
        #btn-e2 { border-color: var(--neon-red); }

        .btn-team.active {
            background-color: var(--active-green) !important;
            color: #000000 !important;
        }

        .round-score {
            font-size: 46px;
            font-weight: bold;
            color: var(--neon-blue);
            background-color: #02091A;
            border: 2px solid var(--neon-blue);
            padding: 0px 35px;
            border-radius: 2px;
            margin-bottom: 5px;
        }

        .main-board {
            background-color: var(--panel-bg);
            border: 2px solid var(--border-neon);
            border-radius: 4px;
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            flex: 1;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        .question-text {
            font-size: 31px;
            font-weight: bold;
            text-align: center;
            white-space: pre-line;
            line-height: 1.3;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            flex: 1;
            margin: 10px 0;
        }

        .answer-card {
            background-color: #061126;
            border: 1px solid var(--border-neon);
            color: var(--neon-blue);
            font-size: 37px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
            padding: 10px;
            white-space: pre-line;
            user-select: none;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .answer-card:hover {
            background-color: #0a1b3d;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        .answer-card.revealed {
            background-color: var(--revealed-bg);
            color: var(--revealed-fg);
            border-color: var(--border-neon);
            font-size: 31px; /* Text mărit un pic, fiind singur pe card */
        }

        .status-prompt {
            font-size: 21px;
            font-weight: bold;
            color: var(--text-gold);
            text-align: center;
            transition: color 0.3s ease;
        }

        .status-prompt.error-shake {
            color: var(--neon-red) !important;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 5px;
        }

        .btn-nav {
            background-color: #050B17;
            color: #FFFFFF;
            border: 1px solid #1E293B;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        .credits {
            font-size: 16px;
            font-weight: bold;
            font-style: italic;
            color: #475569;
        }

        .custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(2, 9, 26, 0.88);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--border-neon);
            border-radius: 6px;
            padding: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.25);
        }

        .modal-text {
            font-size: 20px;
            font-weight: bold;
            color: #FFFFFF;
            margin-bottom: 25px;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .results-table th {
            background-color: var(--button-dark);
            color: var(--text-gold);
            padding: 12px;
            font-size: 16px;
        }

        .results-table td {
            background-color: var(--bg-dark);
            padding: 12px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #1E293B;
        }

        #fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }

        .firework-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            box-shadow: 0 0 12px currentColor, 0 0 24px currentColor, 0 0 36px currentColor;
            animation: megaExplode 1.4s cubic-bezier(0.05, 0.9, 0.2, 1) forwards;
        }

        @keyframes megaExplode {
            0% {
                transform: translate(0, 0) scale(2);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0.1);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            body { padding: 8px; }
            .fullscreen-btn { top: 5px; font-size: 10px; padding: 2px 8px; }
            .top-header { padding-top: 25px; align-items: center; }
            .team-panel { width: 38%; }
            .team-title { font-size: 12px; margin-bottom: 4px; word-break: break-word; }
            .btn-team { padding: 4px 6px; font-size: 9px; width: 100%; text-align: center; }
            .round-score { font-size: 20px; padding: 2px 10px; margin-bottom: 0; }
            .main-board { padding: 10px; }
            .question-text { font-size: 14px; }
            .answers-grid { grid-template-columns: 1fr; grid-template-rows: auto; gap: 6px; margin: 8px 0; }
            .answer-card { font-size: 18px; padding: 8px 4px; min-height: 40px; }
            .answer-card.revealed { font-size: 14px; }
            .status-prompt { font-size: 11px; }
            .credits { font-size: 9px; }
            .btn-nav { padding: 4px 8px; font-size: 10px; }
            .results-table th, .results-table td { padding: 6px; font-size: 11px; }
        }
    </style>
</head>
<body>

<div id="fireworks-container"></div>

<button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Ecran Complet</button>

<div class="container" id="game-container">
    <div class="top-header">
        <div class="team-panel">
            <div class="team-title" id="lbl-e1">DISTRIBUȚESCU: 0</div>
            <button class="btn-team" id="btn-e1" onclick="selectTeam(1)">⚡ Alege DISTRIBUȚESCU</button>
        </div>
        
        <div class="round-score" id="lbl-total-round">0</div>

        <div class="team-panel" style="align-items: flex-end;">
            <div class="team-title" id="lbl-e2">FURNI_MEȘTERESCU: 0</div>
            <button class="btn-team" id="btn-e2" onclick="selectTeam(2)">⚡ Alege FURNI_MEȘTERESCU</button>
        </div>
    </div>

    <div class="main-board" id="main-board">
        <div class="question-text" id="lbl-question"></div>
        <div class="answers-grid" id="answers-grid"></div>
        <div class="status-prompt" id="lbl-status"></div>
    </div>

    <div class="nav-footer">
        <button class="btn-nav" onclick="confirmPrevQuestion()">◀ Înapoi</button>
        <div class="credits">Creat de: Mihaela Iordache & Buhă Demis</div>
        <button class="btn-nav" onclick="confirmNextQuestion()">Înainte ▶</button>
    </div>
</div>

<div class="custom-modal" id="custom-modal">
    <div class="modal-content">
        <div class="modal-text" id="modal-text"></div>
        <div class="modal-buttons" id="modal-buttons-container">
            <button class="btn-team" style="border-color: var(--active-green);" id="modal-btn-yes">DA</button>
            <button class="btn-team" style="border-color: var(--neon-red);" id="modal-btn-no">NU</button>
        </div>
    </div>
</div>

<script>
    const ECHIPA1 = "DISTRIBUȚESCU";
    const ECHIPA2 = "FURNI_MEȘTERESCU";

    const QUESTIONS = [
        {
            intrebare: "Ce se așteaptă clientul să se întâmple cu AUTOCITIREA lui după ce apasă «TRIMITE»?",
            raspunsuri: [
                ["Autocitirea să fie folosită", 30],
                ["Factura să reflecte consumul real", 22],
                ["Să primească o confirmare", 18],
                ["Să ajungă unde trebuie", 12],
                ["Să nu apară vreo eroare de sistem", 10],
                ["Să nu fie nevoie să vină și cu contorul", 8]
            ]
        },
        {
            intrebare: "Ce se poate întâmpla dacă AUTOCITIREA transmisă nu este utilizată efectiv?",
            raspunsuri: [
                ["Factura poate fi estimată", 32],
                ["Apare o regularizare ulterior", 20],
                ["Clientul cere explicații", 16],
                ["Crește munca de clarificare", 12],
                ["«Păi… eu de ce v-am mai trimis indexul?»", 12],
                ["Contorul devine cel mai plimbat membru", 8]
            ]
        },
        {
            intrebare: "Ce facem noi, CREATORII, când avem o astfel de situație?",
            raspunsuri: [
                ["Identificăm și construim soluția", 30],
                ["Lucrăm împreună", 22],
                ["Folosim inteligent datele existente", 18],
                ["Întrebăm «Cum facem să se poată?»", 12],
                ["Facem un excel, evident", 10],
                ["Sigur nu așteptăm să se rezolve singură", 8]
            ]
        },
        {
            intrebare: "Ce s-a schimbat după ce ne-am folosit SUPERPUTEREA și am optimizat procesul?",
            raspunsuri: [
                ["Preluarea autocitirilor a ajuns la 95%", 30],
                ["Mai puține estimări", 25],
                ["Mai multe date reale utilizate", 16],
                ["Proces mai eficient", 12],
                ["Mai multă valoare pentru client", 10],
                ["Clientul poate lăsa contorul acasă", 7]
            ]
        }
    ];

    let currentQIdx = 0;
    let scor1 = 0;
    let scor2 = 0;
    let selectedTeam = null;
    let fireworksInterval = null;

    let revealedAnswersHistory = QUESTIONS.map(q => 
        q.raspunsuri.map(() => ({ revealed: false, team: null }))
    );

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.log(err));
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    function playRevealSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = "sine";
            osc.frequency.setValueAtTime(900, ctx.currentTime);
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        } catch (e) { console.log(e); }
    }

    function showCustomModal(text, onYes, showNo = true) {
        const modal = document.getElementById("custom-modal");
        const modalText = document.getElementById("modal-text");
        const btnYes = document.getElementById("modal-btn-yes");
        const btnNo = document.getElementById("modal-btn-no");

        modalText.innerHTML = text;
        modal.style.display = "flex";

        if (!showNo) {
            btnNo.style.display = "none";
            btnYes.textContent = "START JOC";
        } else {
            btnNo.style.display = "inline-block";
            btnYes.textContent = "DA";
        }

        btnYes.onclick = () => {
            modal.style.display = "none";
            if (onYes) onYes();
        };

        btnNo.onclick = () => {
            modal.style.display = "none";
        };
    }

    function selectTeam(teamNum) {
        selectedTeam = teamNum;
        updateStatusPrompt();
    }

    function updateStatusPrompt() {
        const btnE1 = document.getElementById("btn-e1");
        const btnE2 = document.getElementById("btn-e2");
        const lblStatus = document.getElementById("lbl-status");

        btnE1.classList.remove("active");
        btnE2.classList.remove("active");

        if (selectedTeam === null) {
            lblStatus.textContent = "✦ Alege echipa de sus, apoi apasă pe o cifră ✦";
            lblStatus.style.color = "var(--text-gold)";
        } else {
            if (selectedTeam === 1) {
                btnE1.classList.add("active");
                lblStatus.textContent = `✔ ECHIPA SELECTATĂ: ${ECHIPA1} ► Apasă o cifră!`;
            } else {
                btnE2.classList.add("active");
                lblStatus.textContent = `✔ ECHIPA SELECTATĂ: ${ECHIPA2} ► Apasă o cifră!`;
            }
            lblStatus.style.color = "var(--active-green)";
        }
    }

    function loadQuestion() {
        selectedTeam = null;

        if (currentQIdx >= QUESTIONS.length) {
            showFinalResults();
            return;
        }

        const qData = QUESTIONS[currentQIdx];
        document.getElementById("lbl-question").textContent = `RUNDA ${currentQIdx + 1}/${QUESTIONS.length}\n${qData.intrebare}`;

        const grid = document.getElementById("answers-grid");
        grid.innerHTML = "";

        let roundScore = 0;
        const currentStates = revealedAnswersHistory[currentQIdx];

        for (let i = 0; i < 6; i++) {
            const card = document.createElement("div");
            card.className = "answer-card";

            if (i < qData.raspunsuri.length) {
                const [text, puncte] = qData.raspunsuri[i];
                if (currentStates[i].revealed) {
                    card.classList.add("revealed");
                    card.textContent = text; // Afișează DOAR textul, fără puncte/steluțe
                    roundScore += puncte;
                } else {
                    card.textContent = i + 1; // Afișează cifra (1, 2, 3...) pe căsuță
                }
                card.onclick = () => toggleAnswerClick(i);
            } else {
                card.style.visibility = "hidden";
            }
            grid.appendChild(card);
        }

        document.getElementById("lbl-total-round").textContent = roundScore;
        updateStatusPrompt();
    }

    function toggleAnswerClick(idx) {
        const qData = QUESTIONS[currentQIdx];
        if (idx >= qData.raspunsuri.length) return;

        const state = revealedAnswersHistory[currentQIdx][idx];

        if (state.revealed) {
            const [_, puncte] = qData.raspunsuri[idx];
            if (state.team === 1) {
                scor1 = Math.max(0, scor1 - puncte);
                document.getElementById("lbl-e1").textContent = `${ECHIPA1}: ${scor1}`;
            } else if (state.team === 2) {
                scor2 = Math.max(0, scor2 - puncte);
                document.getElementById("lbl-e2").textContent = `${ECHIPA2}: ${scor2}`;
            }

            state.revealed = false;
            state.team = null;
            loadQuestion();
        } else {
            if (selectedTeam === null) {
                const lblStatus = document.getElementById("lbl-status");
                lblStatus.textContent = "⚠️ Alege mai întâi echipa dând click pe butonul de sus!";
                lblStatus.classList.remove("error-shake");
                void lblStatus.offsetWidth;
                lblStatus.classList.add("error-shake");
                return;
            }

            playRevealSound();
            state.revealed = true;
            state.team = selectedTeam;

            const [_, puncte] = qData.raspunsuri[idx];
            if (selectedTeam === 1) {
                scor1 += puncte;
                document.getElementById("lbl-e1").textContent = `${ECHIPA1}: ${scor1}`;
            } else {
                scor2 += puncte;
                document.getElementById("lbl-e2").textContent = `${ECHIPA2}: ${scor2}`;
            }

            selectedTeam = null;
            loadQuestion();
        }
    }

    function confirmNextQuestion() {
        const msg = currentQIdx === QUESTIONS.length - 1 ? "Vrei să afișezi REZULTATUL FINAL?" : "Vrei să treci la ÎNTREBAREA URMĂTOARE?";
        showCustomModal(msg, () => {
            currentQIdx++;
            loadQuestion();
        }, true);
    }

    function confirmPrevQuestion() {
        if (currentQIdx <= 0) return;
        showCustomModal("Vrei să te întorci la ÎNTREBAREA ANTERIOARĂ?", () => {
            currentQIdx--;
            loadQuestion();
        }, true);
    }

    document.addEventListener("keydown", (e) => {
        if (["Enter", " ", "ArrowRight"].includes(e.key)) confirmNextQuestion();
        if (["ArrowLeft", "Backspace"].includes(e.key)) confirmPrevQuestion();
        if (["1", "2", "3", "4", "5", "6"].includes(e.key)) {
            toggleAnswerClick(parseInt(e.key) - 1);
        }
    });

    function startFireworksShow() {
        const container = document.getElementById("fireworks-container");
        const colors = ["#FFC800", "#00D2FF", "#FF0044", "#00FF66", "#00F0FF", "#FFFFFF", "#FF00FF", "#FFA500"];
        
        triggerBurst(container, colors);

        fireworksInterval = setInterval(() => {
            triggerBurst(container, colors);
        }, 900);
    }

    function triggerBurst(container, colors) {
        for (let b = 0; b < 2; b++) {
            const startX = window.innerWidth * (0.15 + Math.random() * 0.7);
            const startY = window.innerHeight * (0.15 + Math.random() * 0.7);
            const particleCount = 45;

            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement("div");
                p.className = "firework-particle";
                p.style.left = `${startX}px`;
                p.style.top = `${startY}px`;
                
                const color = colors[Math.floor(Math.random() * colors.length)];
                p.style.backgroundColor = color;
                p.style.color = color;

                const angle = Math.random() * Math.PI * 2;
                const distance = 100 + Math.random() * 220;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                p.style.setProperty("--dx", `${dx}px`);
                p.style.setProperty("--dy", `${dy}px`);

                container.appendChild(p);
                setTimeout(() => p.remove(), 1400);
            }
        }
    }

    function showFinalResults() {
        const container = document.getElementById("game-container");
        let winnerText = "";

        if (scor1 > scor2) winnerText = `🎉 Câștigător: ${ECHIPA1}!`;
        else if (scor2 > scor1) winnerText = `🎉 Câștigător: ${ECHIPA2}!`;
        else winnerText = "🤝 Egalitate spectaculoasă!";

        container.innerHTML = `
            <div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%; text-align: center; padding-top: 30px; position: relative; z-index: 10;">
                <div>
                    <h1 style="color: var(--text-gold); font-size: 28px; margin-bottom: 5px;">🏆 CLASAMENT FINAL 🏆</h1>
                    <p style="color: #94A3B8; font-style: italic; margin-bottom: 20px; font-size: 14px;">Am întrebat 100 de Clienți — Rezultate spectacol</p>
                    
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>LOC</th>
                                <th>ECHIPĂ</th>
                                <th>PUNCTAJ</th>
                                <th>REZULTAT</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>${scor1 >= scor2 ? ECHIPA1 : ECHIPA2}</td>
                                <td>${Math.max(scor1, scor2)} pct</td>
                                <td>${scor1 === scor2 ? "🤝 EGALITATE" : "🥇 CÂȘTIGĂTOR"}</td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>${scor1 >= scor2 ? ECHIPA2 : ECHIPA1}</td>
                                <td>${Math.min(scor1, scor2)} pct</td>
                                <td>${scor1 === scor2 ? "🤝 EGALITATE" : "🥈 Locul 2"}</td>
                            </tr>
                        </tbody>
                    </table>

                    <h2 style="color: var(--active-green); font-size: 22px; margin-top: 25px;">${winnerText}</h2>
                    <button class="btn-team" style="margin-top: 15px; background-color: var(--neon-red);" onclick="location.reload()">Reîncepe Jocul</button>
                </div>
