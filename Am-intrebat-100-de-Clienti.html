<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viitorul la puterea noi - Am întrebat 100 de Clienți</title>
    <style>
        :root {
            --bg-dark: #02091A;
            --panel-bg: #030D22;
            --border-neon: #00D2FF;
            --text-gold: #FFC800;
            --neon-red: #FF0044;
            --neon-blue: #00F0FF;
            --button-dark: #0A1325;
            --revealed-bg: #162340;
            --revealed-fg: #00FFCC;
            --active-green: #00FF66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* HEADER OPTIMIZAT PENTRU MOBIL */
        .top-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .team-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1 1 40%;
            min-width: 140px;
        }

        .team-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--neon-red);
            text-shadow: 0 0 5px var(--neon-red);
            text-align: center;
            word-break: break-word;
        }

        .team-title.blue {
            color: var(--text-gold);
            text-shadow: 0 0 5px var(--text-gold);
        }

        .score-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            order: 0;
            flex: 1 1 100%;
            margin-bottom: 5px;
        }

        @media (min-width: 600px) {
            .score-center {
                order: initial;
                flex: 0 0 auto;
                margin-bottom: 0;
            }
            .team-box {
                flex: 0 1 auto;
            }
            .team-title {
                font-size: 16px;
            }
        }

        .total-score {
            font-size: 28px;
            font-weight: bold;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            padding: 2px 15px;
            border-radius: 4px;
            box-shadow: 0 0 10px var(--neon-blue);
            background: rgba(0, 240, 255, 0.1);
        }

        .btn-team {
            background: var(--button-dark);
            border: 1px solid var(--text-gold);
            color: #FFF;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-team:hover, .btn-team.active {
            background: var(--text-gold);
            color: #000;
            box-shadow: 0 0 8px var(--text-gold);
        }

        .fullscreen-btn {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            margin-bottom: 4px;
        }

        /* MAIN BOARD */
        .board {
            width: 100%;
            max-width: 900px;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-neon);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .round-title {
            text-align: center;
            font-size: 14px;
            color: #AAA;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-box {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #FFF;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-top: 5px;
        }

        @media (min-width: 500px) {
            .answers-grid {
                grid-template-columns: 1fr 1fr;
            }
            .question-box {
                font-size: 18px;
            }
        }

        .answer-card {
            height: 55px;
            background: linear-gradient(180deg, #071630 0%, #030A18 100%);
            border: 1px solid #1A3058;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--neon-blue);
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s, border-color 0.2s;
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: 4px;
        }

        .answer-card:active {
            transform: scale(0.98);
        }

        .answer-card.revealed {
            background: var(--revealed-bg);
            border-color: var(--revealed-fg);
            color: #FFF;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .answer-card.revealed .pts {
            color: var(--text-gold);
            font-weight: bold;
            font-size: 15px;
            background: rgba(255, 200, 0, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--text-gold);
        }

        .instruction-footer {
            text-align: center;
            color: var(--neon-red);
            font-size: 11px;
            margin-top: 5px;
            font-weight: 500;
        }

        /* CONTROLS & FOOTER */
        .controls {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .btn-nav {
            background: #0A1526;
            border: 1px solid #1E3A66;
            color: #FFF;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .credits {
            font-size: 10px;
            color: #556B8D;
            font-style: italic;
            text-align: center;
        }

        /* RESULTS TABLE */
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .results-table th, .results-table td {
            border: 1px solid #1A3058;
            padding: 8px;
            text-align: center;
            font-size: 13px;
        }

        .results-table th {
            background-color: #0A1833;
            color: var(--neon-blue);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="team-box">
            <span class="team-title blue" id="title-team1">DISTRIBUȚESCU: 0</span>
            <button class="btn-team" onclick="selectTeam(1)">⚡ Alege DISTRIBUȚESCU</button>
        </div>

        <div class="score-center">
            <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Ecran Complet</button>
            <div class="total-score" id="round-score">0</div>
        </div>

        <div class="team-box">
            <span class="team-title" id="title-team2">FURNI_MEȘTERESCU: 0</span>
            <button class="btn-team" onclick="selectTeam(2)">⚡ Alege FURNI_MEȘTERESCU</button>
        </div>
    </div>

    <div class="board" id="main-board">
        <!-- Content generated dynamically -->
    </div>

    <div class="controls">
        <button class="btn-nav" id="btn-prev" onclick="changeQuestion(-1)">◄ Înapoi</button>
        <div class="credits">Creat de: Mihaela Iordache & Buhă Demis</div>
        <button class="btn-nav" id="btn-next" onclick="changeQuestion(1)">Înainte ►</button>
    </div>

    <script>
        const ECHIPA1 = "DISTRIBUȚESCU";
        const ECHIPA2 = "FURNI_MEȘTERESCU";

        const questionsData = [
            {
                question: "Ce reprezintă autocitirea indexului de energie electrică sau gaze naturale?",
                answers: [
                    { text: "Transmiterea indexului de către client", pts: 40 },
                    { text: "O modalitate de a evita estimările", pts: 25 },
                    { text: "Un mod de control al consumului", pts: 20 },
                    { text: "O obligație contractuală/opțiune", pts: 10 },
                    { text: "O metodă de reducere a erorilor de facturare", pts: 5 }
                ]
            },
            {
                question: "Ce se poate întâmpla dacă AUTOCITIREA transmisă nu este utilizată efectiv?",
                answers: [
                    { text: "Facturarea se face pe baza de estimare", pts: 35 },
                    { text: "Apar neînțelegeri/reclamații din partea clientului", pts: 30 },
                    { text: "Se emite o factură incorectă sau diferită de consumul real", pts: 15 },
                    { text: "Clientul achită mai mult sau mai puțin decât a consumat", pts: 10 },
                    { text: "Este necesară o regularizare ulterioară", pts: 6 },
                    { text: "Scade încrederea clientului în furnizor/operator", pts: 4 }
                ]
            },
            {
                question: "Ce soluții propuneți pentru a ne asigura că indexul autocitit este preluat și utilizat?",
                answers: [
                    { text: "Avertizări/Mesaje de eroare la introducerea unui index eronat", pts: 35 },
                    { text: "Confirmare automată a primirii indexului (SMS/E-mail)", pts: 25 },
                    { text: "Sincronizare mai bună între sisteme (Furnizor - Distribuitor)", pts: 20 },
                    { text: "Campanii de informare/educare a clienților", pts: 12 },
                    { text: "Termene mai clare și mai vizibile pentru transmiterea indexului", pts: 8 }
                ]
            },
            {
                question: "Ce atribute ale aplicației pot crește gradul de utilizare al autocitirii?",
                answers: [
                    { text: "Interfață simplă și ușor de folosit", pts: 40 },
                    { text: "Notificări/Alertă pentru perioada de transmitere", pts: 25 },
                    { text: "Transmitere rapidă (fără mulți pași)", pts: 15 },
                    { text: "Istoric al indexurilor și consumului vizibil", pts: 12 },
                    { text: "Posibilitatea de a adăuga poză cu contorul", pts: 8 }
                ]
            }
        ];

        let currentQ = 0;
        let score1 = 0;
        let score2 = 0;
        let currentRoundPoints = 0;
        let activeTeam = null; 
        let revealedStates = [];

        function initRevealedStates() {
            revealedStates = questionsData.map(q => new Array(q.answers.length).fill(false));
        }

        initRevealedStates();

        function updateHeader() {
            document.getElementById('title-team1').innerText = `${ECHIPA1}: ${score1}`;
            document.getElementById('title-team2').innerText = `${ECHIPA2}: ${score2}`;
            document.getElementById('round-score').innerText = currentRoundPoints;

            const btns = document.querySelectorAll('.btn-team');
            btns[0].classList.toggle('active', activeTeam === 1);
            btns[1].classList.toggle('active', activeTeam === 2);
        }

        function selectTeam(teamNum) {
            activeTeam = teamNum;
            updateHeader();
        }

        function revealAnswer(index) {
            if (revealedStates[currentQ][index]) return;

            revealedStates[currentQ][index] = true;
            const pts = questionsData[currentQ].answers[index].pts;
            currentRoundPoints += pts;

            if (activeTeam === 1) score1 += pts;
            if (activeTeam === 2) score2 += pts;

            updateHeader();
            renderQuestion();
        }

        function renderQuestion() {
            const board = document.getElementById('main-board');
            
            if (currentQ >= questionsData.length) {
                renderFinalScreen(board);
                return;
            }

            const q = questionsData[currentQ];
            
            let answersHTML = q.answers.map((ans, idx) => {
                const isRevealed = revealedStates[currentQ][idx];
                if (isRevealed) {
                    return `<div class="answer-card revealed">
                        <span>${ans.text}</span>
                        <span class="pts">${ans.pts}</span>
                    </div>`;
                } else {
                    return `<div class="answer-card" onclick="revealAnswer(${idx})">${idx + 1}</div>`;
                }
            }).join('');

            board.innerHTML = `
                <div class="round-title">Runda ${currentQ + 1}/${questionsData.length}</div>
                <div class="question-box">${q.question}</div>
                <div class="answers-grid">${answersHTML}</div>
                <div class="instruction-footer">✦ Alege echipa de sus, apoi apasă caseta corespunzătoare ✦</div>
            `;

            document.getElementById('btn-prev').disabled = currentQ === 0;
            document.getElementById('btn-next').innerText = (currentQ === questionsData.length - 1) ? "Finalizează ►" : "Înainte ►";
        }

        function renderFinalScreen(board) {
            let castigatoare = "EGALITATE!";
            if (score1 > score2) castigatoare = `CÂȘTIGĂTOR: ${ECHIPA1}! 🎉`;
            else if (score2 > score1) castigatoare = `CÂȘTIGĂTOR: ${ECHIPA2}! 🎉`;

            board.innerHTML = `
                <h1 style="color: var(--text-gold); font-size: 22px; text-align:center; margin-bottom: 5px;">🏆 CLASAMENT FINAL 🏆</h1>
                <p style="color: #94A3B8; font-style: italic; margin-bottom: 15px; text-align:center; font-size: 13px;">Am întrebat 100 de Clienți – Rezultate</p>
                <h2 style="color: var(--active-green); text-align:center; font-size: 18px; margin-bottom: 15px;">${castigatoare}</h2>

                <table class="results-table">
                    <thead>
                        <tr>
                            <th>LOC</th>
                            <th>ECHIPĂ</th>
                            <th>PUNCTAJ</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>${score1 >= score2 ? ECHIPA1 : ECHIPA2}</td>
                            <td>${Math.max(score1, score2)} pct</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>${score1 >= score2 ? ECHIPA2 : ECHIPA1}</td>
                            <td>${Math.min(score1, score2)} pct</td>
                        </tr>
                    </tbody>
                </table>

                <button class="btn-team" style="margin: 20px auto 0 auto; display: block; padding: 10px 20px;" onclick="location.reload()">Reîncepe Jocul</button>
            `;

            document.getElementById('btn-prev').disabled = false;
            document.getElementById('btn-next').disabled = true;
        }

        function changeQuestion(dir) {
            if (dir === 1 && currentQ < questionsData.length) {
                currentQ++;
                currentRoundPoints = 0;
            } else if (dir === -1 && currentQ > 0) {
                currentQ--;
                currentRoundPoints = 0;
            }
            updateHeader();
            renderQuestion();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        updateHeader();
        renderQuestion();
    </script>
</body>
</html>
