<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viitorul la puterea noi - Duelul</title>
    <style>
        :root {
            --bg-dark: #071536;
            --panel-bg: #0099FF;
            --dark-blue: #0F3278;
            --border-blue: #50C8FF;
            --yellow: #FFC300;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--white);
            font-family: Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            padding: 12px 15px 8px 15px;
            position: relative;
        }

        /* Cercuri concentrice fundal */
        .bg-circles {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160vw;
            height: 160vw;
            pointer-events: none;
            z-index: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle {
            position: absolute;
            border: 1px solid rgba(80, 200, 255, 0.15);
            border-radius: 50%;
        }

        /* Buton Ecran Complet */
        .fullscreen-btn {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: #050B17;
            color: var(--border-blue);
            border: 1px solid var(--border-blue);
            padding: 2px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            z-index: 100;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .fullscreen-btn:hover {
            opacity: 1;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            z-index: 1;
        }

        /* Scorul Total (SUS) - Marit la 42px */
        .score-box {
            background-color: var(--dark-blue);
            border: 3px solid var(--border-blue);
            border-radius: 12px;
            width: 180px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            color: var(--yellow);
            margin-top: 10px;
        }

        /* Panou Central */
        .main-panel {
            background-color: var(--panel-bg);
            border: 4px solid var(--border-blue);
            border-radius: 20px;
            width: 95%;
            height: 80%;
            padding: 25px 30px 15px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Întrebare - Marită la 36px */
        .question-text {
            font-size: 36px;
            font-weight: bold;
            font-style: italic;
            text-align: center;
            color: var(--white);
        }

        .cards-container {
            width: 88%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            justify-content: center;
            flex: 1;
            margin: 15px 0;
        }

        .card {
            background-color: var(--dark-blue);
            border: 3px solid var(--border-blue);
            border-radius: 15px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0 10px;
            user-select: none;
            position: relative;
        }

        /* Număr card ascuns - Marit la 40px */
        .card-num-box {
            background-color: var(--yellow);
            border: 2px solid var(--white);
            border-radius: 10px;
            width: 85px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            color: #071536;
        }

        .card.revealed {
            justify-content: space-between;
            padding: 0 12px 0 25px;
        }

        /* Text Răspuns - Marit la 28px */
        .card-text {
            font-size: 28px;
            font-weight: bold;
            color: var(--white);
        }

        /* Puncte - Marite la 36px */
        .card-pts-box {
            background-color: var(--panel-bg);
            border: 2px solid var(--white);
            border-radius: 10px;
            width: 100px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: var(--yellow);
        }

        /* Ghid Comenzi - Marit la 26px */
        .hint-text {
            font-size: 26px;
            font-weight: bold;
            color: var(--yellow);
            text-align: center;
        }

        /* Semnătură Dreapta Jos - Marită la 16px */
        .footer-credits {
            width: 100%;
            display: flex;
            justify-content: flex-end;
        }

        .credits {
            font-size: 16px;
            font-weight: bold;
            font-style: italic;
            color: var(--border-blue);
        }
    </style>
</head>
<body>

<button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Ecran Complet</button>

<div class="bg-circles" id="bg-circles"></div>

<div class="container">
    <div class="score-box" id="lbl-total-score">0</div>

    <div class="main-panel">
        <div class="question-text" id="lbl-question"></div>
        <div class="cards-container" id="cards-container"></div>
        <div class="hint-text">[ Apasă 1, 2 sau 3 pentru răspunsuri | Tasta X pentru Eroare ]</div>
    </div>

    <div class="footer-credits">
        <div class="credits">Creat de: Mihaela Iordache & Buhă Demis</div>
    </div>
</div>

<script>
    const QUESTION_DATA = {
        intrebare: "Ce face prima dată clientul când primește o factură mai mare decât se aștepta?",
        optiuni: [
            { num: "1", text: "Sună la furnizor", pts: 50, revealed: false },
            { num: "2", text: "Se uită la contor", pts: 30, revealed: false },
            { num: "3", text: "Întreabă familia ce a consumat", pts: 20, revealed: false }
        ]
    };

    let totalScore = 0;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playCorrectSound() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
    }

    function playWrongSound() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.log(err));
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    function createBgCircles() {
        const bgContainer = document.getElementById("bg-circles");
        for (let r = 100; r < 2000; r += 100) {
            const circle = document.createElement("div");
            circle.className = "circle";
            circle.style.width = `${r * 2}px`;
            circle.style.height = `${r * 2}px`;
            bgContainer.appendChild(circle);
        }
    }

    function renderBoard() {
        document.getElementById("lbl-total-score").textContent = totalScore;
        document.getElementById("lbl-question").textContent = QUESTION_DATA.intrebare;

        const container = document.getElementById("cards-container");
        container.innerHTML = "";

        QUESTION_DATA.optiuni.forEach((item, idx) => {
            const card = document.createElement("div");
            card.className = "card" + (item.revealed ? " revealed" : "");
            
            if (item.revealed) {
                card.innerHTML = `
                    <div class="card-text">${item.text}</div>
                    <div class="card-pts-box">${item.pts}</div>
                `;
            } else {
                card.innerHTML = `
                    <div class="card-num-box">${item.num}</div>
                `;
            }

            card.onclick = () => toggleCard(idx);
            container.appendChild(card);
        });
    }

    function toggleCard(idx) {
        const item = QUESTION_DATA.optiuni[idx];
        if (!item.revealed) {
            item.revealed = true;
            totalScore += item.pts;
            playCorrectSound();
        } else {
            item.revealed = false;
            totalScore = Math.max(0, totalScore - item.pts);
        }
        renderBoard();
    }

    document.addEventListener("keydown", (e) => {
        if (["1", "2", "3"].includes(e.key)) {
            toggleCard(parseInt(e.key) - 1);
        } else if (e.key.toLowerCase() === "x") {
            playWrongSound();
        }
    });

    createBgCircles();
    renderBoard();
</script>

</body>
</html>
